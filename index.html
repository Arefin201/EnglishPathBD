  {id:'g-be',t:'Be Verbs — am / is / are',lvl:0,

   ex:['I have a laptop.','He has two brothers.','We have a class today.'],
   mst:['❌ He have a car. → ✅ He has a car.'],

/* Build the 180-day curriculum */
const CURRICULUM = (() => {
  const days = [];
  let n = 0;
  MONTHS.forEach((mo, mi) => {
    mo.topics.forEach((topic, ti) => {
      for (let k = 0; k < 2; k++) {
        n++;
        const isPractice = k === 1;
        days.push({
          day: n, month: mi + 1, monthName: mo.m, topic,
          title: isPractice ? `${topic} — Practice` : topic,
          level: Math.min(6, Math.floor(mi / 2)),
          isPractice,
          vocabIdx: ((n - 1) * 8) % VOCAB.length,
          grammarIdx: (n - 1) % GRAMMAR.length,
          patternIdx: (n - 1) % PATTERNS.length,
          speakIdx: (n - 1) % SPEAK_TOPICS.length,
          listenIdx: (n - 1) % LISTENING.length,
          readIdx: (n - 1) % READING.length,
          writeIdx: (n - 1) % WRITING.length,
          pronIdx: (n - 1) % PRON.length
        });
      }
    });
  });
  return days;
})();

function deepMerge(base, incoming) {
  if (Array.isArray(base)) return Array.isArray(incoming) ? incoming : base;
  if (base && typeof base === 'object') {
    const out = { ...base };
    if (incoming && typeof incoming === 'object' && !Array.isArray(incoming)) {
      Object.keys(incoming).forEach(k => { out[k] = k in base ? deepMerge(base[k], incoming[k]) : incoming[k]; });
    }
    return out;
  }
  return incoming === undefined ? base : incoming;
}

function migrateState(parsed) {
  const merged = deepMerge(defaultState(), parsed || {});
  merged.schemaVersion = SCHEMA_VERSION;
  if (!Number.isFinite(merged.speaking.seconds)) merged.speaking.seconds = (Number(merged.speaking.minutes) || 0) * 60;
  merged.speaking.minutes = Math.floor((Number(merged.speaking.seconds) || 0) / 60);
  return merged;
}

let S = (() => {
  try {
    const raw = localStorage.getItem(LS_KEY) || localStorage.getItem(LEGACY_LS_KEY);
    if (!raw) return defaultState();
    const migrated = migrateState(JSON.parse(raw));
    localStorage.setItem(LS_KEY, JSON.stringify(migrated));
    return migrated;
  } catch(e) { return defaultState(); }
})();

function save() {
  try {
    S.schemaVersion = SCHEMA_VERSION;
    localStorage.setItem(LS_KEY, JSON.stringify(S));
    return true;
  } catch(e) {
    toast('Your browser could not save this change. Export a backup before continuing.', 'warn');
    return false;
  }
}

const $ = (sel, root=document) => root.querySelector(sel);

const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localDateParts = d => [d.getFullYear(), d.getMonth(), d.getDate()];
const todayKey = () => {
  const [y,m,day] = localDateParts(new Date());
  return `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
};
const dayDiff = (a,b) => {
  const [ay,am,ad] = a.split('-').map(Number);
  const [by,bm,bd] = b.split('-').map(Number);
  return Math.round((Date.UTC(by,bm-1,bd)-Date.UTC(ay,am-1,ad))/86400000);
};

let voicesReady = false;
function loadVoices(){ if(!('speechSynthesis' in window)) return; window.speechSynthesis.getVoices(); voicesReady=true; }
if ('speechSynthesis' in window) { loadVoices(); window.speechSynthesis.onvoiceschanged = loadVoices; }

function speak(text, rate) {
  if (!('speechSynthesis' in window)) { toast('Speech is not supported in this browser.','error'); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const voices = window.speechSynthesis.getVoices();
  const v = voices.find(x => /en-GB/i.test(x.lang)) || voices.find(x => /en-US/i.test(x.lang)) || voices.find(x => /^en/i.test(x.lang));
  if (v) u.voice = v;
  u.rate = rate ?? S.settings.audioRate ?? 1;
  u.pitch = 1;
  window.speechSynthesis.speak(u);
}
function stopSpeak(){ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }

/* Recording + speech recognition */
const Rec = {
  mediaRecorder:null, chunks:[], stream:null, url:null, recognition:null, transcript:'', onText:null, active:false, mimeType:'',
  async start(onText){
    if (this.active) return true;
    this.transcript=''; this.onText=onText;
    try {
      if (!navigator.mediaDevices?.getUserMedia) throw new Error('Microphone API unavailable');
      this.stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      this.chunks = [];
      const candidates = ['audio/webm;codecs=opus','audio/webm','audio/mp4'];
      this.mimeType = candidates.find(t => window.MediaRecorder?.isTypeSupported?.(t)) || '';
      this.mediaRecorder = new MediaRecorder(this.stream, this.mimeType ? {mimeType:this.mimeType} : undefined);
      this.mediaRecorder.ondataavailable = e => { if (e.data?.size) this.chunks.push(e.data); };
      this.mediaRecorder.start(250);
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SR) {
        this.recognition = new SR();
        this.recognition.lang = 'en-US';
        this.recognition.continuous = true;
        this.recognition.interimResults = true;
        this.recognition.onresult = e => {
          let t = '';
          for (let i=0;i<e.results.length;i++) t += e.results[i][0].transcript + ' ';
          this.transcript = t.trim();
          this.onText && this.onText(this.transcript);
        };
        try { this.recognition.start(); } catch(e){}
      }
      this.active = true;
      return true;
    } catch(e) {
      this.cleanup();
      toast('Microphone unavailable. Check browser permission or type your answer instead.','warn');
      return false;
    }
  },
  stop(){
    if (!this.mediaRecorder && !this.active) return Promise.resolve(this.url);
    this.active = false;
    try { this.recognition?.stop(); } catch(e){}
    this.recognition = null;
    const recorder = this.mediaRecorder;
    if (!recorder) { this.cleanup(); return Promise.resolve(this.url); }
    return new Promise(resolve => {
      const finish = () => {
        const type = this.mimeType || recorder.mimeType || 'audio/webm';
        const blob = new Blob(this.chunks, { type });
        if (this.url) URL.revokeObjectURL(this.url);
        this.url = blob.size ? URL.createObjectURL(blob) : null;
        this.stream?.getTracks?.().forEach(t => t.stop());
        this.mediaRecorder = null;
        this.stream = null;
        this.chunks = [];
        this.mimeType = '';
        resolve(this.url);
      };
      recorder.onstop = finish;
      try { recorder.stop(); } catch(e) { finish(); }
    });
  },
  cleanup(){
    try { this.recognition?.stop(); } catch(e){}
    this.stream?.getTracks?.().forEach(t => t.stop());
    this.recognition = null;
    this.mediaRecorder = null;
    this.stream = null;
    this.chunks = [];
    this.active = false;
  }
};

function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

/* ─────────────────────── 4. PROGRESS ENGINE ─────────────────────── */
const Progress = {
  touchStreak(){
    const today = todayKey();
    const last = S.streak.lastDate;
    if (last === today) return;
    if (!last) { S.streak.current = 1; }
    else {
      const diff = dayDiff(last, today);
      S.streak.current = diff === 1 ? S.streak.current + 1 : 1;
    }
    S.streak.lastDate = today;
    S.streak.longest = Math.max(S.streak.longest, S.streak.current);
    S.streak.history.push(today);
    if (S.streak.current > 1) toast(`🔥 ${S.streak.current} day streak! Keep going.`, 'success');
    save();
  },
  addXP(n, reason){
    S.xp += n; save();
    toast(`+${n} XP ${reason ? '· ' + reason : ''}`, 'xp');
    App.renderChrome();
    Progress.checkAchievements();
  },
  level(){
    const xp = S.xp;
    const levels = [0,100,250,500,900,1400,2000,2800,3800,5000,7000,10000];
    let lv = 1;
    for (let i=0;i<levels.length;i++) if (xp >= levels[i]) lv = i+1;
    const cur = levels[lv-1] ?? 0, next = levels[lv] ?? (cur + 2000);
    return { lv, cur, next, pct: Math.min(100, Math.round(((xp-cur)/(next-cur))*100)) };
  },
  completeLesson(id, skillMap){
    if (!S.completedLessons.includes(id)) {
      S.completedLessons.push(id);
      Progress.bumpSkills(skillMap || {vocabulary:2, grammar:2, speaking:2});
      save();
      Progress.addXP(40, 'Lesson complete');
      Progress.touchStreak();
    }
  },
  bumpSkills(map){
    Object.keys(map).forEach(k => {
      if (S.skills[k] === undefined) S.skills[k] = 0;
      S.skills[k] = Math.min(100, S.skills[k] + map[k]);
    });
    save();
  },
  logSpeaking(seconds, topic, transcript){
    const safeSeconds = Math.max(0, Math.round(Number(seconds) || 0));
    S.speaking.sessions.push({ date:Date.now(), seconds:safeSeconds, topic, transcript: transcript || '' });
    S.speaking.seconds = (Number(S.speaking.seconds) || 0) + safeSeconds;
    S.speaking.minutes = Math.floor(S.speaking.seconds / 60);
    Progress.bumpSkills({ speaking: Math.min(8, Math.max(2, Math.round(seconds/15))) });
    Progress.addXP(15, 'Speaking practice');
    Progress.touchStreak();
    save();
  },
  logQuiz(pct, topic){
    S.quiz.attempts.push({ date:Date.now(), pct, topic });
    Progress.bumpSkills({ grammar: pct>=70?3:1, vocabulary: pct>=70?2:1 });
    Progress.addXP(Math.round(pct/10), 'Quiz');
    Progress.touchStreak();
    save();
  },
  addMistake(m){
    if (!S.mistakes.find(x => x.wrong === m.wrong)) {
      S.mistakes.push({ ...m, date:Date.now(), count:1 });
    } else {
      S.mistakes.find(x => x.wrong === m.wrong).count++;
    }
    save();
  },
  checkAchievements(){
    ACHIEVEMENTS.forEach(a => {
      if (!S.unlocked) S.unlocked = [];
      if (!S.unlocked.includes(a.id) && a.check(S)) {
        S.unlocked.push(a.id);
        save();
        setTimeout(() => toast(`${a.emoji} Achievement unlocked: <strong>${a.n}</strong>`, 'success'), 500);
      }
    });
  },
  skillLabel(v){
    if (v < 30) return { t:'Needs Practice', c:'text-rose-600 bg-rose-50 dark:bg-rose-950/40 dark:text-rose-300' };
    if (v < 55) return { t:'Developing', c:'text-amber-600 bg-amber-50 dark:bg-amber-950/40 dark:text-amber-300' };
    if (v < 75) return { t:'Good Progress', c:'text-brand-600 bg-brand-50 dark:bg-brand-950/40 dark:text-brand-300' };
    if (v < 90) return { t:'Strong', c:'text-emerald-600 bg-emerald-50 dark:bg-emerald-950/40 dark:text-emerald-300' };
    return { t:'Advanced', c:'text-emerald-700 bg-emerald-100 dark:bg-emerald-900/50 dark:text-emerald-200' };
  }
};

}

/* Quiz engine */
function renderQuiz(questions, containerId, onDone) {
  const state = { answers:{}, submitted:false };
  const html = questions.map((q, i) => {
    const type = q.type || 'mcq';
    if (type === 'mcq') {
      return `<div class="mb-5" data-q="${i}">
        <div class="font-semibold text-sm mb-3 text-slate-900 dark:text-white">${i+1}. ${esc(q.q)}</div>
        <div class="space-y-2">${q.o.map((opt, j) =>
          `<button onclick="Quiz.pick('${containerId}',${i},${j})" data-opt="${j}"
            class="quiz-opt w-full text-left px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-rose-400 hover:bg-emerald-50/60 dark:hover:border-rose-500 dark:hover:bg-emerald-950/30 text-sm transition">
            <span class="inline-block w-5 font-bold text-slate-400">${String.fromCharCode(65+j)}</span>${esc(opt)}</button>`).join('')}</div>
      </div>`;
    }
    if (type === 'tf') {
      return `<div class="mb-5" data-q="${i}">
        <div class="font-semibold text-sm mb-3 text-slate-900 dark:text-white">${i+1}. ${esc(q.q)}</div>
        <div class="flex gap-2">${q.o.map((opt, j) =>
          `<button onclick="Quiz.pick('${containerId}',${i},${j})" data-opt="${j}"
            class="quiz-opt flex-1 px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-brand-400 text-sm font-semibold transition">${esc(opt)}</button>`).join('')}</div>
      </div>`;
    }
    return `<div class="mb-5" data-q="${i}">
      <div class="font-semibold text-sm mb-2 text-slate-900 dark:text-white">${i+1}. ${esc(q.q)}</div>
      <input class="quiz-text w-full px-4 py-3 rounded-xl bg-slate-100 dark:bg-slate-800 border border-transparent focus:border-brand-400 outline-none text-sm"
        placeholder="Type your answer…" oninput="Quiz.type('${containerId}',${i},this.value)" />
    </div>`;
  }).join('');

  Quiz.registry[containerId] = { questions, state, onDone };

  return `<div id="${containerId}">${html}
    <button onclick="Quiz.submit('${containerId}')" class="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm transition">Check Answers</button>
    <div id="${containerId}-result" class="mt-4"></div>
  </div>`;
}

const Quiz = {
  registry: {},
  pick(cid, qi, oi) {
    const reg = this.registry[cid]; if (!reg || reg.state.submitted) return;
    reg.state.answers[qi] = oi;

    const HOVER_CLASSES = [
      'hover:border-rose-400','hover:bg-emerald-50/60',
      'dark:hover:border-rose-500','dark:hover:bg-emerald-950/30'
    ];
    const SELECTED_CLASSES = [
      'border-blue-500','bg-blue-100',
      'dark:border-blue-400','dark:bg-blue-950/50'
    ];

    $$(`#${cid} [data-q="${qi}"] .quiz-opt`).forEach(b => {
      // Reset all state classes
      b.classList.remove(...SELECTED_CLASSES);
      b.classList.remove(
        'border-brand-500','bg-brand-50','dark:bg-brand-950/40',
        'border-emerald-500','bg-emerald-50','dark:bg-emerald-950/30',
        'border-rose-500','bg-rose-50','dark:bg-rose-950/30'
      );

      if (+b.dataset.opt === oi) {
        // ✅ Selected → Blue, remove hover so it stays blue
        b.classList.remove(...HOVER_CLASSES);
        b.classList.add(...SELECTED_CLASSES);
      } else {
        // Not selected → re-enable hover effect
        b.classList.add(...HOVER_CLASSES);
      }
    });
  },
  type(cid, qi, val) {
    const reg = this.registry[cid]; if (!reg) return;
    reg.state.answers[qi] = val;
  },
  submit(cid) {
    const reg = this.registry[cid]; if (!reg) return;
    const { questions, state } = reg;
    state.submitted = true;
    let correct = 0;
    questions.forEach((q, i) => {
      const type = q.type || 'mcq';
      const given = state.answers[i];
      let ok = false;
      if (type === 'mcq' || type === 'tf') ok = Number(given) === q.a;
      else ok = String(given || '').trim().toLowerCase().replace(/[.!?,]/g,'') === String(q.a).trim().toLowerCase().replace(/[.!?,]/g,'');
      if (ok) correct++;
      if (type === 'mcq' || type === 'tf') {
        $$(`#${cid} [data-q="${i}"] .quiz-opt`).forEach(b => {
          b.disabled = true;
          const j = +b.dataset.opt;

          // Remove all prior state (blue selected + hover)
          b.classList.remove(
            'border-blue-500','bg-blue-100','dark:border-blue-400','dark:bg-blue-950/50',
            'hover:border-rose-400','hover:bg-emerald-50/60',
            'dark:hover:border-rose-500','dark:hover:bg-emerald-950/30',
            'border-emerald-500','bg-emerald-50','dark:bg-emerald-950/30',
            'border-rose-500','bg-rose-50','dark:bg-rose-950/30'
          );

          if (j === q.a) {
            // ✅ Correct answer → Green
            b.classList.add('border-emerald-500','bg-emerald-100','dark:bg-emerald-950/40','dark:border-emerald-500');
          } else if (j === Number(given)) {
            // ❌ Selected but wrong → Red
            b.classList.add('border-rose-500','bg-rose-100','dark:bg-rose-950/40','dark:border-rose-500');
          }
          // else: not selected + not correct → stays neutral
        });
      }
    });
    if (!questions.length) {
      $(`#${cid}-result`).innerHTML = '<div class="p-4 rounded-xl bg-amber-50 text-amber-700">No questions are available in this quiz.</div>';
      return;
    }
    $(`#${cid} .quiz-text`)?.setAttribute('disabled','true');
    const pct = Math.round((correct/questions.length)*100);
    const tone = pct>=80?'emerald':pct>=60?'amber':'rose';
    const msg = pct>=80 ? 'Excellent! 🎉' : pct>=60 ? 'Good effort — review and try again.' : 'Keep going. Mistakes are part of learning.';
    $(`#${cid}-result`).innerHTML = `
      <div class="rounded-2xl p-5 bg-${tone}-50 dark:bg-${tone}-950/30 border border-${tone}-200 dark:border-${tone}-900">
        <div class="text-3xl font-extrabold text-${tone}-700 dark:text-${tone}-300">${pct}%</div>
        <div class="text-sm font-semibold text-${tone}-700 dark:text-${tone}-300 mt-1">${correct} / ${questions.length} correct</div>
        <p class="text-sm text-slate-600 dark:text-slate-300 mt-2">${msg}</p>
      </div>`;
    Progress.logQuiz(pct, 'Practice quiz');
    reg.onDone && reg.onDone(pct);
  }
};

function parseHash() {
  const h = location.hash || '#/home';
  const parts = h.replace(/^#\//,'').split('/').filter(Boolean);
  return { path: parts[0] || 'home', arg: parts[1] };
}

/* ─────────────────── AI CHAT ENGINE ─────────────────── */
const Chat = {
  mode: 'free',
  history: [],
  role: null,
  pendingFollow: 0,
  init(){
    if (this.history.length === 0) {
      this.push('ai', `Hello! I'm your English tutor. 👋<br><br>We can just talk, or you can choose a roleplay on the left. Try writing something in English — I'll help you make it more natural.<br><br><em>নমস্কার! আমি আপনার English Tutor। ইংরেজিতে লিখুন বা বলুন — আমি ভুলগুলো ঠিক করে আরও স্বাভাবিক বিকল্প দেখাবো।</em>`);
    } else {
      this.render();
    }
  },
  push(who, text){
    this.history.push({ who, text, time: Date.now() });
    this.render();
  },
  render(){
    const body = $('#chatBody');
    if (!body) return;
    body.innerHTML = this.history.map(m => m.who === 'ai' ? `
      <div class="flex gap-3">
        <div class="w-8 h-8 shrink-0 rounded-full bg-gradient-to-br from-brand-500 to-brand-700 grid place-items-center text-white text-sm">🤖</div>
        <div class="max-w-[85%] p-3.5 rounded-2xl rounded-tl-sm bg-slate-100 dark:bg-slate-800 text-sm text-slate-800 dark:text-slate-100 leading-relaxed">${m.text}</div>
      </div>` : `
      <div class="flex gap-3 flex-row-reverse">
        <div class="w-8 h-8 shrink-0 rounded-full bg-slate-200 dark:bg-slate-700 grid place-items-center text-sm">👤</div>
        <div class="max-w-[85%] p-3.5 rounded-2xl rounded-tr-sm bg-brand-600 text-white text-sm leading-relaxed">${esc(m.text)}</div>
      </div>`).join('');
    body.scrollTop = body.scrollHeight;
  },
  async send(text){
    if (!text.trim()) return;
    this.push('user', text);
    $('#chatInput').value = '';
    S.ai.chats++; save();
    await new Promise(r => setTimeout(r, 420));
    const reply = this.respond(text);
    this.push('ai', reply);
    Progress.touchStreak();
    Progress.checkAchievements();
  },
  correct(text){
    const lower = ' ' + text.toLowerCase() + ' ';
    const found = [];
    // Known mistake patterns
    const rules = [
      [/\bi am agree\b/i, 'I agree', 'agree', 'Agree is a verb — it does not need "am".'],
      [/\bi am go\b/i, 'I went', 'am go', 'For a finished past action, use the past form: went.'],
      [/\bdidn'?t went\b/i, "didn't go", "didn't went", 'After "didn\'t", use the base form: go.'],
      [/\bdiscuss about\b/i, 'discuss', 'discuss about', '"Discuss" does not take "about".'],
      [/\bi have a confusion\b/i, 'I am confused', 'a confusion', 'Use "I am confused" instead.'],
      [/\bi am understanding\b/i, 'I understand', 'am understanding', '"Understand" is a state verb — no -ing.'],
      [/\bhe go\b/i, 'he goes', 'he go', 'With he/she/it, add -s in present simple.'],
      [/\bshe go\b/i, 'she goes', 'she go', 'With he/she/it, add -s in present simple.'],
      [/\bmyself \w+/i, 'My name is…', 'myself', '"Myself" is not used for introductions.'],
      [/\bi am from bangladesh, no\?/i, "I'm from Bangladesh, aren't I?", 'no?', 'English uses tag questions, not "no?".'],
      [/\bgood in english\b/i, 'good at English', 'good in', 'The correct collocation is "good at".'],
      [/\brevert back\b/i, 'reply', 'revert back', '"Revert back" is not natural English.'],
      [/\bdo one thing\b/i, "here's what you can do", 'do one thing', 'This phrase sounds unnatural internationally.'],
      [/\bi have \d+ years\b/i, 'I am … years old', 'have years', 'Age uses "be", not "have".'],
      [/\bi am living in .* since\b/i, 'I have been living in … since', 'am living since', 'With "since", use present perfect continuous.'],
      [/\bwhat you are doing\b/i, 'what are you doing', 'word order', 'In questions, the auxiliary comes before the subject.'],
      [/\bwhere you live\b/i, 'where do you live', 'word order', 'Questions need an auxiliary: do/does/did.'],
      [/\bi am feeling bore\b/i, 'I am bored', 'bore', 'Use the adjective "bored".'],
      [/\btoday i go\b/i, 'today I went', 'go', 'If it already happened, use past simple: went.']
    ];
    rules.forEach(([re, correct, wrong, why]) => {
      if (re.test(text)) found.push({ wrong, correct, why });
    });
    // Generic: yesterday + present tense
    if (/\byesterday\b/i.test(text) && /\b(go|eat|come|see|do|take|meet)\b/i.test(text) && !/\b(went|ate|came|saw|did|took|met)\b/i.test(text)) {
      found.push({ wrong:'present verb with "yesterday"', correct:'past simple', why:'"Yesterday" requires past simple: went, ate, came, saw, did, took, met.' });
    }
    return found;
  },
  respond(text){
    const t = text.trim();
    const lower = t.toLowerCase();

    // Grammar explanation
    if (/^(explain|what is|what are)\b/.test(lower) && /(grammar|tense|article|preposition|conditional|passive|modal|present|past)/.test(lower)) {
      const g = GRAMMAR.find(g => lower.includes(g.t.toLowerCase().split(' ')[0].toLowerCase()));
      if (g) return `<strong>${esc(g.t)}</strong><br><br>${esc(g.rule)}<br><br><em class="text-xs">${esc(g.bn)}</em><br><br><strong>Examples:</strong><br>${g.ex.map(e=>'• '+esc(e)).join('<br>')}<br><br><strong>Common mistakes:</strong><br>${g.mst.map(e=>'• '+esc(e)).join('<br>')}`;
      return `I can explain grammar! Try asking something like:<br>• "Explain present perfect"<br>• "Explain articles"<br>• "Explain conditionals"`;
    }

    // Word explanation
    const wordMatch = lower.match(/^(what does|meaning of|explain the word)\s+["']?([a-z]+)["']?/);
    if (wordMatch) {
      const v = VOCAB.find(v => v.w === wordMatch[2]);
      if (v) return `<strong>${esc(v.w)}</strong> ${esc(v.ipa)} <em>${esc(v.pos)}</em><br><br><span class="bn">${esc(v.bn)}</span><br>${esc(v.def)}<br><br><strong>Example:</strong> "${esc(v.ex)}"<br><strong>Collocations:</strong> ${v.col.map(esc).join(', ')}<br><strong>Synonyms:</strong> ${v.syn.map(esc).join(', ') || '—'}<br><br><em>Now try using it in your own sentence!</em>`;
      return `I don't have "${esc(wordMatch[2])}" in my learner dictionary yet. Try a word from your lessons, or ask me to explain a grammar point instead.`;
    }

    // Corrections
    const corrections = this.correct(t);
    let out = '';

    if (corrections.length) {
      out += `<div class="mb-3 p-3 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900">
        <div class="text-[10px] font-extrabold uppercase tracking-wider text-rose-500 mb-1">❌ What you wrote</div>
        <div class="text-sm text-rose-800 dark:text-rose-200">${esc(t)}</div>
      </div>`;
      corrections.forEach(c => {
        Progress.addMistake(c);
        out += `<div class="mb-3 p-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-900">
          <div class="text-[10px] font-extrabold uppercase tracking-wider text-emerald-600 mb-1">✅ Better</div>
          <div class="text-sm font-semibold text-emerald-800 dark:text-emerald-200">${esc(t.replace(new RegExp(c.wrong.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), c.correct))}</div>
          <div class="text-xs text-slate-600 dark:text-slate-300 mt-2">${esc(c.why)}</div>
        </div>`;
      });
      out += `<div class="mb-2 text-sm text-slate-600 dark:text-slate-300">Good attempt! 👏 Now try another sentence using the corrected form.</div>`;
      return out;
    }

    // Roleplay follow-ups
    if (this.role && this.role.follow.length) {
      const q = this.role.follow[this.pendingFollow % this.role.follow.length];
      this.pendingFollow++;
      out += `<div class="mb-2 text-sm">${esc(t)} — that's good. 👍</div>`;
      out += `<div class="text-sm font-semibold">${esc(q)}</div>`;
      return out;
    }

    // Free conversation — keyword based
    if (/\b(hello|hi|hey|assalamu|salam)\b/.test(lower)) return `Hello! 👋 Great to see you. How are you feeling today?`;
    if (/\bhow are you\b/.test(lower)) return `I'm doing well, thank you for asking! 😊 And you? Try answering with: "I'm doing well, thanks." or "I'm a bit tired today."`;
    if (/\b(my name is|i am called|i'm)\b/.test(lower)) return `Nice to meet you! 🎉 Now tell me one more thing: <strong>where are you from?</strong>`;
    if (/\b(i am from|i'm from|i live in)\b/.test(lower)) return `That's a great place! Now tell me: <strong>what do you do — are you a student or do you work?</strong>`;
    if (/\b(student|study|university|college)\b/.test(lower)) return `Nice! What subject are you studying, and why did you choose it? Try to answer in 2–3 sentences.`;
    if (/\b(work|job|office|company)\b/.test(lower)) return `Interesting! What does a typical day at your work look like? Use present simple: "I start at…", "I usually…"`;
    if (/\b(hobby|free time|enjoy|like to)\b/.test(lower)) return `That sounds fun! How long have you been doing that? Try: "I've been … for … years."`;
    if (/\b(family|father|mother|brother|sister)\b/.test(lower)) return `Family is important. 🙂 How many people are in your family, and what do they do?`;
    if (/\b(english|learn|improve|practice|practise)\b/.test(lower)) return `That's a great goal! 💪 Tell me: <strong>what is the hardest part of English for you — speaking, listening, grammar or vocabulary?</strong>`;
    if (/\b(thank|thanks|dhonnobad)\b/.test(lower)) return `You're very welcome! 😊 Keep practising — small steps every day add up. What would you like to practise next?`;
    if (/\b(yes|no|ok|okay|fine|good|great)\b/.test(lower) && t.split(' ').length <= 3) return `Good. Now try to expand your answer a little — for example, add "because…" to give a reason. Can you say that again in a longer sentence?`;

    // Default — encourage expansion
    const wordCount = t.split(/\s+/).filter(Boolean).length;
    if (wordCount < 5) {
      return `Nice start! Now try to make it longer. Add <strong>why</strong> or <strong>when</strong>.<br><br>Example: "${esc(t)} because…" or "Yesterday, ${esc(t.toLowerCase())}."`;
    }
    return `Good effort! Your sentence is clear. 👍<br><br>To sound more natural, you could connect ideas with <strong>because</strong>, <strong>so</strong>, or <strong>but</strong>. Try saying it again with one connector.<br><br>And tell me — what else do you want to talk about?`;
  },
  reset(){
    this.history = []; this.role = null; this.pendingFollow = 0;
    $('#aiMode').textContent = 'Free conversation';
    this.init();
    toast('Conversation reset.','info');
  },
  startRole(id){
    const r = ROLES.find(x => x.id === id);
    if (!r) return;
    this.role = r; this.pendingFollow = 0;
    this.history = [];
    const el = $('#aiMode'); if (el) el.textContent = 'Roleplay: ' + r.n;
    this.push('ai', `<div class="mb-2 text-xs font-bold uppercase tracking-wider text-brand-500">Roleplay mode · ${esc(r.n)} <span class="bn font-normal">(${esc(r.bn)})</span></div>${esc(r.start)}`);
    if (location.hash !== '#/ai-tutor') App.go('#/ai-tutor');
  }
};

  search(q){
    const box = $('#searchResults');
    if (!q || q.length < 2) { box.classList.add('hidden'); return; }
    const s = q.toLowerCase();
    const results = [];
    VOCAB.filter(v => v.w.toLowerCase().includes(s) || v.bn.includes(q)).slice(0,4).forEach(v => results.push({ t:v.w, s:'Vocabulary · '+v.bn, h:'#/vocabulary' }));

    SPEAK_TOPICS.filter(t => t.t.toLowerCase().includes(s)).slice(0,3).forEach(t => results.push({ t:t.t, s:'Speaking topic', h:'#/speaking' }));
    CONVERSATIONS.filter(c => c.t.toLowerCase().includes(s)).slice(0,3).forEach(c => results.push({ t:c.t, s:'Conversation', h:'#/conversation' }));
    CURRICULUM.filter(d => d.title.toLowerCase().includes(s)).slice(0,3).forEach(d => results.push({ t:d.title, s:'Day '+d.day, h:'#/lesson/'+d.day }));
    if (!results.length) { box.innerHTML = `<div class="p-4 text-sm text-slate-500">No results for "${esc(q)}"</div>`; box.classList.remove('hidden'); return; }
    box.innerHTML = results.map(r => `<a href="${r.h}" onclick="App.closeSearch()" class="block p-3 hover:bg-slate-50 dark:hover:bg-slate-800 border-b border-slate-100 dark:border-slate-800 last:border-0">
      <div class="text-sm font-semibold text-slate-900 dark:text-white">${esc(r.t)}</div>
      <div class="text-xs text-slate-500">${esc(r.s)}</div>
    </a>`).join('');
    box.classList.remove('hidden');
  },

  finishLevelTest(pct){

    if (pct < 30) { level = 'Complete Beginner'; recommend = 'Level 0 — Zero course'; }
    else if (pct < 50) { level = 'Beginner'; recommend = 'Level 1 — Foundation course'; }
    else if (pct < 65) { level = 'Elementary'; recommend = 'Foundation Speaking Course'; }
    else if (pct < 80) { level = 'Intermediate'; recommend = 'Daily Conversation + Intermediate Speaking'; }
    else if (pct < 92) { level = 'Upper Intermediate'; recommend = 'Professional English + Debate Practice'; }
    else { level = 'Advanced'; recommend = 'Job English / IELTS Foundation / Advanced Discussion'; }
    S.levelTest = { pct, level, recommend, date:Date.now() };

  checkWriting(inputId, resultId, isEssay){
    const val = $('#'+inputId).value.trim();
    const box = $('#'+resultId);
    if (!val) { box.innerHTML = `<div class="p-4 rounded-xl bg-amber-50 dark:bg-amber-950/30 text-sm text-amber-700 dark:text-amber-300">Please write something first.</div>`; return; }
    const words = val.split(/\s+/).filter(Boolean).length;
    const corrections = Chat.correct(val);
    const sentences = val.split(/[.!?]+/).filter(s => s.trim().length);
    const avgLen = Math.round(words / Math.max(1, sentences.length));

    let html = `<div class="p-5 rounded-2xl bg-slate-50 dark:bg-slate-800/60 space-y-4">`;
    html += `<div class="grid grid-cols-3 gap-3 text-center">
      <div><div class="text-xl font-extrabold text-slate-900 dark:text-white">${words}</div><div class="text-[10px] uppercase tracking-wider text-slate-400 font-bold">Words</div></div>
      <div><div class="text-xl font-extrabold text-slate-900 dark:text-white">${sentences.length}</div><div class="text-[10px] uppercase tracking-wider text-slate-400 font-bold">Sentences</div></div>
      <div><div class="text-xl font-extrabold text-slate-900 dark:text-white">${avgLen}</div><div class="text-[10px] uppercase tracking-wider text-slate-400 font-bold">Avg. length</div></div>
    </div>`;

    if (isEssay && words < 200) {
      html += `<div class="p-3 rounded-xl bg-amber-50 dark:bg-amber-950/30 text-sm text-amber-700 dark:text-amber-300">Task 2 requires at least 250 words (foundation target: 200+). You have ${words}. Keep writing — add an example for each point.</div>`;
    }

    if (corrections.length) {
      html += `<div><div class="text-xs font-extrabold uppercase tracking-wider text-rose-500 mb-2">Grammar & usage notes</div>`;
      corrections.forEach(c => {
        html += `<div class="mb-2 p-3 rounded-xl bg-white dark:bg-slate-900 border border-rose-200 dark:border-rose-900">
          <div class="text-xs text-rose-600 dark:text-rose-400 line-through">${esc(c.wrong)}</div>
          <div class="text-sm font-semibold text-emerald-700 dark:text-emerald-300 mt-1">→ ${esc(c.correct)}</div>
          <div class="text-xs text-slate-500 mt-1">${esc(c.why)}</div>
        </div>`;
      });
      html += `</div>`;
    } else {
      html += `<div class="p-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/30 text-sm text-emerald-700 dark:text-emerald-300">✅ No common mistakes detected. Good work!</div>`;
    }

    // Structure tips
    const tips = [];
    if (avgLen < 6) tips.push('Your sentences are quite short. Try joining two ideas with "because", "and" or "but".');
    if (avgLen > 25) tips.push('Some sentences are very long. Break them into two shorter sentences for clarity.');
    if (!/\b(because|so|however|although|therefore)\b/i.test(val)) tips.push('Add a linking word (because, however, therefore) to connect your ideas.');
    if (isEssay && !/\b(firstly|first|secondly|second|finally|in conclusion|to conclude)\b/i.test(val)) tips.push('For essays, use paragraph signposts: Firstly… Secondly… In conclusion…');
    if (isEssay && !/\b(for example|for instance|such as)\b/i.test(val)) tips.push('Add at least one example with "For example…"');
    if (!tips.length) tips.push('Structure looks good. Read it aloud once to check fluency.');

    html += `<div><div class="text-xs font-extrabold uppercase tracking-wider text-brand-500 mb-2">Suggestions</div>
      <ul class="space-y-1.5 text-sm text-slate-600 dark:text-slate-300">${tips.map(t => `<li>• ${esc(t)}</li>`).join('')}</ul></div>`;

    html += `<div class="text-xs text-slate-400">This is practice feedback, not an official score.</div>`;
    html += `</div>`;
    box.innerHTML = html;
    Progress.addXP(10, 'Writing practice');
    Progress.touchStreak();
  },

    modal(`<div class="p-6">
      <h3 class="font-extrabold text-slate-900 dark:text-white">Reset all data?</h3>
      <p class="text-sm text-slate-500 mt-2">This will delete your progress, vocabulary, streaks and journal entries. This cannot be undone.</p>
      <div class="mt-5 flex gap-2">
        ${Btn('Cancel','App.closeModal()','ghost','flex-1')}
        ${Btn('Yes, reset','App.confirmReset()','danger','flex-1')}
      </div>
    </div>`);
  },
  confirmReset(){
    localStorage.removeItem(LS_KEY);
    S = defaultState();
    save();
    closeModal();
    App.applyTheme();
    App.renderChrome();
    App.go('#/home');
    render();
    toast('All data reset.','info');
  },
  init(){
    App.applyTheme();
    App.renderChrome();
    render();
    window.addEventListener('hashchange', render);
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#globalSearch') && !e.target.closest('#searchResults')) App.closeSearch();
    });
    const updateConnection = () => {
      const el = $('#connectionStatus');
      if (!el) return;
      const online = navigator.onLine;
      el.className = `hidden sm:flex items-center gap-1.5 text-[10px] font-bold ${online ? 'text-emerald-600 dark:text-emerald-400' : 'text-amber-600 dark:text-amber-400'}`;
      el.innerHTML = `<span class="w-2 h-2 rounded-full bg-current"></span><span>${online ? 'Online' : 'Offline'}</span>`;
      el.title = online ? 'Online' : 'Offline — your local progress still works';
    };
    window.addEventListener('online', updateConnection);
    window.addEventListener('offline', updateConnection);
    updateConnection();
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('./service-worker.js').catch(() => {});
    }
    // First visit → onboarding
    if (!S.user.onboarded && (location.hash === '' || location.hash === '#/home')) {
      setTimeout(() => { if (!S.user.onboarded) App.go('#/onboarding'); }, 600);
    }
    Progress.checkAchievements();
    console.log('%cEnglishPath BD','background:#4f46e5;color:#fff;padding:4px 10px;border-radius:6px;font-weight:bold','Prototype loaded.');
  }
};

window.addEventListener('error', (e) => {
  if (e?.error) console.error('EnglishPath BD runtime error:', e.error);
});
window.addEventListener('unhandledrejection', (e) => {
  console.error('EnglishPath BD async error:', e.reason);
});
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', App.init);
} else {
  App.init();
}
window.App = App;
window.Chat = Chat;
window.Quiz = Quiz;
window.Progress = Progress;
window.Views = Views;
</script>
</body>
</html>
